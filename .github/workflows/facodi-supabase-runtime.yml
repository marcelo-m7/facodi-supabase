name: FACODI Supabase runtime contract

on:
  pull_request:
    paths:
      - "facodi-processing-plane/**"
      - ".github/workflows/facodi-supabase-runtime.yml"
  push:
    branches: [master]
    paths:
      - "facodi-processing-plane/**"
      - ".github/workflows/facodi-supabase-runtime.yml"

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate FACODI-only Supabase runtime
        run: python3 -m unittest discover -s facodi-processing-plane/tests -p 'test_*.py' -v
      - name: Canonical worker, provider, bounded transport and secret authentication
        working-directory: facodi-processing-plane
        run: |
          npx --yes deno@2.9.6 test --frozen --allow-env tests/canonical_worker_test.ts
          npx --yes deno@2.9.6 check --frozen supabase/functions/v4_canonical_analysis/index.ts
  canonical-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: facodi-processing-plane
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable Supabase PostgreSQL
        run: npx --yes supabase@2.120.0 db start
      - name: Validate schema and security
        run: |
          npx --yes supabase@2.120.0 db lint --local --schema public --fail-on warning
          npx --yes supabase@2.120.0 db advisors --local --type security --fail-on warn
      - name: Independent transaction races, crash recovery and access denial
        env:
          FACODI_CANONICAL_TEST_CONTAINER: supabase_db_facodi-processing-plane
        run: |
          docker exec "$FACODI_CANONICAL_TEST_CONTAINER" createdb -U postgres facodi_canonical_ci
          docker exec -i "$FACODI_CANONICAL_TEST_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d facodi_canonical_ci < supabase/migrations/*_facodi_canonical_queue.sql
          docker exec -i "$FACODI_CANONICAL_TEST_CONTAINER" psql -X --single-transaction -v ON_ERROR_STOP=1 -U postgres -d facodi_canonical_ci < supabase/migrations/*_facodi_canonical_commands.sql
          docker exec -i "$FACODI_CANONICAL_TEST_CONTAINER" psql -X --single-transaction -v ON_ERROR_STOP=1 -U postgres -d facodi_canonical_ci < supabase/migrations/*_facodi_canonical_retry.sql
          python3 -m unittest discover -s tests -p 'test_canonical_queue.py' -v
          npx --yes deno@2.9.6 test --frozen --allow-env --allow-run=docker tests/canonical_worker_test.ts
